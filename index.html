<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Visualization - Loading...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #191414;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #1DB954;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 { color: #1DB954; }
    </style>
    <script>
        // Redirigir al index.html después de 1 segundo
        setTimeout(function() {
            window.location.href = '/seaborn-interactivo/index.html';
        }, 1000);
    </script>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h1>🎵 Cargando Spotify Visualization...</h1>
        <p>Redirigiendo...</p>
    </div>
</body>
</html>
